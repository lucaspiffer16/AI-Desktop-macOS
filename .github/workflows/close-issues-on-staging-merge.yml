name: Close Issues On Staging Merge

on:
  pull_request:
    types: [closed]
    branches:
      - staging

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced in PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";

            // Matches keywords like:
            // Closes #1, Fixes #2, Resolved #3, close #4, etc.
            // Also supports owner/repo#123.
            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+((?:[\w.-]+\/[\w.-]+)?#\d+)/gi;

            const refs = new Set();
            let match;
            while ((match = regex.exec(body)) !== null) {
              refs.add(match[1]);
            }

            if (refs.size === 0) {
              core.info("No closable issue references found in PR body.");
              return;
            }

            const currentOwner = context.repo.owner;
            const currentRepo = context.repo.repo;

            for (const ref of refs) {
              let owner = currentOwner;
              let repo = currentRepo;
              let issueNumber;

              if (ref.includes("/")) {
                const [fullRepo, issue] = ref.split("#");
                const parts = fullRepo.split("/");
                owner = parts[0];
                repo = parts[1];
                issueNumber = Number(issue);
              } else {
                issueNumber = Number(ref.replace("#", ""));
              }

              if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
                core.warning(`Skipping invalid issue reference: ${ref}`);
                continue;
              }

              try {
                const issueResp = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });

                if (issueResp.data.state === "closed") {
                  core.info(`Issue already closed: ${owner}/${repo}#${issueNumber}`);
                  continue;
                }

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: "closed",
                });

                core.info(`Closed issue: ${owner}/${repo}#${issueNumber}`);
              } catch (error) {
                core.warning(`Failed to close ${owner}/${repo}#${issueNumber}: ${error.message}`);
              }
            }
